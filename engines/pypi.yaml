name: pypi
engine: xpath
shortcut: pypi
categories: [it, packages]
paging: true
first_page_num: 1
search_url: https://pypi.org/search/?q={query}&page={pageno}
results_xpath: //a[@class="package-snippet"]
url_xpath: ./@href
title_xpath: .//span[@class="package-snippet__name"]
content_xpath: .//p[@class="package-snippet__description"]
