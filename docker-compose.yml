# Example compose for gosearx with an EXTERNAL Valkey (run separately).
#
#   docker compose up -d --build
#
# Set VALKEY_URL to reach your Valkey/Redis. Leave it unset to use the in-memory
# cache automatically. The mounted plugins dir is optional (adds to built-ins).

services:
  gosearx:
    build:
      context: .
    image: gosearx
    ports:
      - "8080:8080"
    environment:
      # Point at your external Valkey; unset/empty => in-memory cache.
      - VALKEY_URL=${VALKEY_URL:-}
      # Optional secrets (expanded into settings.yml at load):
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    volumes:
      # Optional: edit settings (engines, AI, etc.) without rebuilding.
      - ./settings.yml:/app/settings.yml:ro
      # Optional: mount your own plugins; they ADD to the built-ins.
      # - ./my-plugins:/app/custom-plugins:ro
    # Lets `host.docker.internal` resolve to the host (e.g. a host-run Valkey).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
