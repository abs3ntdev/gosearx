# Example compose for gosearx with an EXTERNAL Valkey (run separately).
#
#   docker compose up -d --build
#
# This assumes Valkey/Redis is reachable at the URL in settings.yml's
# `valkey.url` (e.g. valkey://host.docker.internal:6379/1). If you have no
# Valkey, leave `valkey.url` empty in settings.yml — gosearx falls back to an
# in-memory cache automatically.

services:
  gosearx:
    build:
      context: .
    image: gosearx
    ports:
      - "8080:8080"
    # Override the bind address / config path if desired:
    # command: ["serve", "-addr", ":8080", "-config", "/app/settings.yml"]
    volumes:
      # Edit settings (valkey.url, engines, AI, etc.) without rebuilding:
      - ./settings.yml:/app/settings.yml:ro
      # Mount your own plugins here; they ADD to the built-ins (see README).
      - ./my-plugins:/app/custom-plugins:ro
    # On Linux, expose the host to reach a host-run Valkey via
    # host.docker.internal:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
